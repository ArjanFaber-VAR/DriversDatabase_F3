name: DriversF3

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Practice session 
    - cron: '50-59 9 * * 5'
    - cron: '0-35 10 * * 5'

    # Qualifying session
    - cron: '0-30 15 * * 5'
    - cron: '35-59 10 * * 6'
    # Sprint race
    - cron: '0-15 11 * * 6'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run scraper
        run: python f3.py
